{% extends 'base.html' %}{% block content %}<section class="auth-section"><div class="auth-card"><span class="eyebrow">JOIN ASEEL</span><h1>Create account</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name</label><input class="form-control" name="name" required><label>Phone number</label><input class="form-control" type="tel" name="phone" pattern="\+?[0-9]{7,15}" title="Enter 7–15 digits, optionally beginning with +" required><label>Email (optional)</label><input class="form-control" type="email" name="email"><label>Password (minimum 8 characters)</label><input class="form-control" type="password" name="password" minlength="8" required><button class="btn btn-gold w-100 mt-4">Create account</button></form><p class="mt-3">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p></div></section>{% endblock %}
