{% extends 'base.html' %}{% block content %}<section class="dashboard-section"><div class="container narrow"><span class="eyebrow">COUNTER BOOKING</span><h1>Create walk-in order.</h1><p>For customers who visit the shop.</p><form method="post" class="panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Customer name</label><input class="form-control mb-3" name="customer_name" required><label>Phone</label><input class="form-control mb-3" type="tel" name="phone" pattern="\+?[0-9]{7,15}" title="Enter 7–15 digits, optionally beginning with +" required><label>Service</label><select class="form-select mb-3" name="service_id" required>{% for s in services %}<option value="{{ s.id }}">{{ s.name }} — ₹{{ '%.2f'|format(s.price|float) }}/{{ s.unit }}</option>{% endfor %}</select><label>Garment / item</label><input class="form-control mb-3" name="garment"><label>Quantity</label><input class="form-control mb-3" type="number" min="1" name="quantity" value="1" required><button class="btn btn-gold w-100">Create order</button></form></div></section>{% endblock %}
