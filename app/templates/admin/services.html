{% extends 'base.html' %}{% block content %}<section class="dashboard-section"><div class="container"><span class="eyebrow">CATALOGUE</span><h1>Services & pricing</h1><div class="row g-4 mt-1"><div class="col-lg-5"><form method="post" class="panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><h2 class="h4">Add or update service</h2><label>Existing service (optional)</label><select class="form-select mb-3" name="service_id"><option value="">New service</option>{% for s in services %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select><label>Service name</label><input class="form-control mb-3" name="name" required><label>Price (₹)</label><input class="form-control mb-3" type="number" min="0" step="0.01" name="price" required><label>Unit</label><select class="form-select mb-3" name="unit"><option>kg</option><option>piece</option><option>blanket</option><option>pair</option><option>bag</option></select><button class="btn btn-gold w-100">Save service & price</button></form></div><div class="col-lg-7"><div class="panel"><h2 class="h4">Current services</h2>{% for s in services %}<div class="d-flex justify-content-between border-bottom py-3"><div><b>{{ s.name }}</b><small class="d-block text-muted">{{ s.name_ml or '' }}</small></div><b>₹{{ '%.2f'|format(s.price|float) }}/{{ s.unit }}</b></div>{% endfor %}</div></div></div></div></section>{% endblock %}
