{% extends 'base.html' %}{% block content %}<section class="dashboard-section"><div class="container narrow"><span class="eyebrow">NEW BOOKING</span><h1>Book your laundry.</h1><p>Choose one or more services. Prices are managed by the shop.</p><form method="post" enctype="multipart/form-data" class="panel" id="booking-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div id="service-rows"><div class="booking-row row g-2 align-items-end mb-3"><div class="col-md-4"><label>Service</label><select class="form-select" name="service_id" required>{% for s in services %}<option value="{{ s.id }}">{{ s.name }} — ₹{{ '%.2f'|format(s.price|float) }}/{{ s.unit }}</option>{% endfor %}</select></div><div class="col-md-4"><label>Dress / item</label><select class="form-select garment-select" name="garment" required><option value="Other">Other</option>{% for garment in garments if garment != 'Other' %}<option value="{{ garment }}">{{ garment }}</option>{% endfor %}</select><input class="form-control custom-garment d-none mt-2" name="custom_garment" placeholder="Enter the dress or item name"></div><div class="col-md-2"><label>Quantity</label><input class="form-control" type="number" name="quantity" min="1" max="500" value="1" required></div><div class="col-md-2"><button type="button" class="btn btn-outline-gold w-100 remove-row">Remove</button></div></div></div><button type="button" class="btn btn-outline-gold mb-4" id="add-row">＋ Add another service</button><label>Pickup address</label><textarea class="form-control mb-2" name="pickup_address" rows="2" placeholder="Street, area, city"></textarea><input type="hidden" name="pickup_latitude"><input type="hidden" name="pickup_longitude"><button type="button" class="btn btn-outline-gold mb-3" id="booking-location">Use my current location</button><small id="location-message" class="d-block text-muted mb-3" aria-live="polite"></small><label>Special instructions</label><textarea class="form-control mb-2" name="notes" rows="2" placeholder="Anything we should know about these items?"></textarea><label>Instruction photos (optional)</label><input class="form-control mb-3" type="file" name="photos" accept="image/png,image/jpeg,image/webp" multiple><small class="d-block text-muted mb-3">Add up to 5 JPG, PNG, or WebP photos (8 MB total).</small><div class="notice mb-3">Free pickup & delivery offer. The shop will confirm collection timing.</div><button class="btn btn-gold btn-lg w-100">Submit booking</button></form></div></section>{% endblock %}
